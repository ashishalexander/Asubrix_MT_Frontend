name: Deploy to Server (Development)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: SSH Deploy & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up SSH for Server
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload GitHub SSH Key to Server
        run: |
          echo "${{ secrets.REPO_SSH_KEY }}" > id_rsa_web
          chmod 600 id_rsa_web
          scp -o StrictHostKeyChecking=no id_rsa_web ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/.ssh/id_rsa_web
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOSSH'
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo -e "Host github.com\n  IdentityFile ~/.ssh/id_rsa_web\n  IdentitiesOnly yes\n" > ~/.ssh/config
            chmod 600 ~/.ssh/config

      - name: Deploy Application via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd Learning-Application-Web-Dev

            echo "Pulling latest code..."
            git pull origin development

            echo "Building Docker image..."
            docker build -t pudhuyugam-dev:latest .

            echo "Stopping and removing existing container (if any)..."
            docker rm -f pudhuyugam-dev-app || true

            echo "Running new Docker container..."
            docker run -d --name pudhuyugam-dev-app -p 4000:80 pudhuyugam-dev:latest

            echo "✅ Production Deployment complete."
          EOF
